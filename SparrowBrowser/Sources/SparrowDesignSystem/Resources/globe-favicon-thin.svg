<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     fill="none">
  <g stroke="currentColor"
     stroke-width="1.25"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Outer globe -->
    <circle cx="16" cy="16" r="12"/>

    <!-- Equator -->
    <path d="M4 16H28"/>

    <!-- Central meridian -->
    <path d="M16 4V28"/>

    <!-- Curved meridians -->
    <path d="M16 4C11.8 7.1 10.2 11.1 10.2 16C10.2 20.9 11.8 24.9 16 28"/>
    <path d="M16 4C20.2 7.1 21.8 11.1 21.8 16C21.8 20.9 20.2 24.9 16 28"/>

    <!-- Latitude curves -->
    <path d="M6.7 8.4C9.2 10.1 12.4 11 16 11C19.6 11 22.8 10.1 25.3 8.4"/>
    <path d="M6.7 23.6C9.2 21.9 12.4 21 16 21C19.6 21 22.8 21.9 25.3 23.6"/>
  </g>
</svg>
